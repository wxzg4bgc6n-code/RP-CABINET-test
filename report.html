<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#8b5cf6">
  <title>Отчёт о прогрессе · RP Cabinet</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/icons/favicon.svg?v=104" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png?v=104" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=104" sizes="180x180">
  <link rel="manifest" href="site.webmanifest?v=104">
  <link rel="preconnect" href="https://drive.google.com">
  <link rel="preconnect" href="https://www.googleapis.com">
  <link rel="stylesheet" href="css/report.css?v=104">
</head>
<body>
  <main class="report-shell">
    <header class="report-brand">
      <div class="report-logo" id="reportProfileAvatar" aria-label="Аватар профиля"><span>RP</span></div>
      <div>
        <span>Публичный отчёт</span>
        <h1>Отчёт о прогрессе</h1>
      </div>
      <button id="copyReportUrl" type="button">Копировать ссылку</button>
    </header>
    <section class="report-state" id="reportState">
      <div class="report-loader"></div>
      <h2>Загружаю отчёт</h2>
      <p>Проверяю данные на Google Диске.</p>
    </section>
    <section id="reportContent" hidden></section>
    <footer>Скриншоты показываются целиком, без обрезки. Отчёт доступен 8 дней.</footer>
  </main>
  <script>
    window.__rpReportWatchdog=setTimeout(function(){
      var state=document.getElementById('reportState');
      var content=document.getElementById('reportContent');
      if(!state||state.hidden||!content||!content.hidden)return;
      state.classList.add('is-error');
      state.innerHTML='<div class="report-error-mark">!</div><h2>Отчёт не загрузился</h2><p>Google Диск слишком долго не отвечает. Обнови страницу или попробуй ещё раз.</p><button class="report-retry" type="button">Попробовать снова</button>';
      state.querySelector('.report-retry').addEventListener('click',function(){location.reload();});
    },26000);
    window.__rpReportStopWatchdog=function(){
      clearTimeout(window.__rpReportWatchdog);
      window.__rpReportWatchdog=0;
    };
  </script>
  <script src="js/config/google-drive-public-key.js?v=104"></script>
<script src="js/config/google-drive.js?v=104"></script>
  <script src="js/report.js?v=104"></script>
</body>
</html>
